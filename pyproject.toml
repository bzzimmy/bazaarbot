[project]
name = "bazaarbot"
version = "0.1.0"
description = "Python API and CLI for the Hypixel SkyBlock Bazaar, driven through a headless Minecraft client"
readme = "README.md"
authors = [
    { name = "bzzimmy", email = "kernelrocks@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "websockets>=17.2",
]

[project.scripts]
bazaarbot-market = "bazaarbot.market:main"
bazaarbot-run = "bazaarbot.strategy:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
